name: Checkout and display submodules
on: [push, pull_request]

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup SSH key for Vogsphere
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VOGSPHERE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Force Git to use the correct SSH key
        run: |
          echo "Host vogsphere.42paris.fr" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/id_rsa" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Debug SSH Connection
        run: |
          ssh-keyscan -H vogsphere.42paris.fr > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat ~/.ssh/known_hosts
          ssh -T git@vogsphere.42paris.fr || echo "SSH connection failed"

      - name: Check SSH Key Fingerprint
        run: ssh-keygen -lf ~/.ssh/id_rsa

      - name: Initialize and update submodules
        run: |
          git submodule update --init --recursive

      - name: Copy submodule files to main repo
        run: |
          rsync -av --progress Projects/libft_125/ Projects/libft_125_mirror/

      - name: Commit and push updated submodule content
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add Projects/libft_125_mirror/
          git commit -m "Sync submodule content for visibility on GitHub" || echo "No changes to commit"
          git push
