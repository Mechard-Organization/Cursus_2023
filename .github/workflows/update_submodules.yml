name: Update Submodules

on:
  push:
    branches:
      - main_cursus_2023
  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_action_key
          chmod 600 ~/.ssh/github_action_key
          echo "Host github.com" >> ~/.ssh/config
          echo "    IdentityFile ~/.ssh/github_action_key" >> ~/.ssh/config
          echo "    IdentitiesOnly yes" >> ~/.ssh/config

      - name: Test SSH connection to GitHub
        run: ssh -T git@github.com || echo "SSH connection to GitHub failed"

      - name: Test SSH connection to Vogsphere
        run: ssh -T git@vogsphere.42paris.fr || echo "SSH connection to Vogsphere failed"

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --depth=1 --recursive

      - name: Persist credentials for submodules
        run: |
          git config --global url."git@vogsphere.42paris.fr:".insteadOf "https://vogsphere.42paris.fr/"

      - name: Commit and push submodules updates
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Update submodules" || echo "No changes to commit"
          git push origin main_cursus_2023
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/github_action_key -o IdentitiesOnly=yes"
