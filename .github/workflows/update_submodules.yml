name: Checkout and display submodules
on: [push, pull_request]

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VOGSPHERE_SSH_KEY }}" > ~/.ssh/id_rsa_vogsphere
          echo "${{ secrets.MY_GITHUB_SSH_KEY }}" > ~/.ssh/github_action_key
          chmod 600 ~/.ssh/id_rsa_*

      - name: Set correct permissions for GitHub SSH key
        run: chmod 600 ~/.ssh/github_action_key

      - name: Use GitHub SSH key
        run: |
          ssh-agent bash -c 'ssh-add ~/.ssh/github_action_key && git config --global core.sshCommand "ssh -i ~/.ssh/github_action_key -o IdentitiesOnly=yes"'

      - name: Configure SSH for Vogsphere
        run: |
          echo "Host vogsphere.42paris.fr" >> ~/.ssh/config
          echo "  HostName vogsphere.42paris.fr" >> ~/.ssh/config
          echo "  User git" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/id_rsa_vogsphere" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Configure SSH for GitHub
        run: |
          echo "Host github.com" >> ~/.ssh/config
          echo "  User git" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/github_action_key" >> ~/.ssh/config
          echo "  StrictHostKeyChecking accept-new" >> ~/.ssh/config

      - name: Debug SSH Connection
        run: |
          ssh -T git@vogsphere.42paris.fr || echo "SSH connection to Vogsphere failed"
          ssh -T git@github.com || echo "SSH connection to GitHub failed"

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          ssh-key: ${{ secrets.GITHUB_SSH_KEY }}

      - name: Ensure GitHub SSH key is used
        run: |
          ssh-agent bash -c 'ssh-add ~/.ssh/github_action_key && git config --global core.sshCommand "ssh -i ~/.ssh/github_action_key -o IdentitiesOnly=yes"'

      - name: Initialize and update submodules
        run: git submodule update --init --recursive --force

      - name: Copy submodule files to main repo
        run: |
          mkdir -p Projects/libft_125_mirror
          rsync -av --progress Projects/libft_125/ Projects/libft_125_mirror/


      - name: Commit and push updated submodule content
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add Projects/libft_125_mirror/
          git commit -m "Sync submodule content for visibility on GitHub" || echo "No changes to commit"
          git push origin HEAD:main
